services:
  fila-boca-core:
    build: .
    container_name: fila-boca-core
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/filas.db
    volumes:
      - fila_database:/app/data
      - ./logs:/app/logs
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fila_database:
    driver: local
  node_modules:
    driver: local